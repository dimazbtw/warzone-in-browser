<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
// Imagens dos cards de tamanho de squad do lobby: ?n=1..4 (N operadores posados)
import * as THREE from 'three';
import { assets } from '../client/assets/AssetManager.js';
import { characters } from '../client/render/characters/CharacterFactory.js';
const n = +(new URLSearchParams(location.search).get('n') ?? 1), W = 420, H = 560;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.fog = new THREE.Fog(0x2a2f36, 6, 16);
const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
const tones = [['#6b7684', '#23272d'], ['#8a7a5c', '#2a251d'], ['#5f6f5a', '#1f251d'], ['#6a6f7a', '#1e2127']][n - 1];
gr.addColorStop(0, tones[0]); gr.addColorStop(1, tones[1]); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); s.background = new THREE.CanvasTexture(c); s.background.colorSpace = THREE.SRGBColorSpace;
s.add(new THREE.HemisphereLight(0xe6eeff, 0x3a3228, 1.6));
const sun = new THREE.DirectionalLight(0xffe0bc, 3.2); sun.position.set(-3, 5, -4); sun.castShadow = true; s.add(sun);
const rim = new THREE.DirectionalLight(0x9ec8ff, 2.2); rim.position.set(3, 3, 3); s.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x3a3a34, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
await assets.wait(60000);
const layouts = { 1: [[0, 0, 'rifle', 0.5, 'stand']], 2: [[-0.45, 0, 'rifle', 0.35, 'stand'], [0.5, -0.8, 'smg', 0.6, 'stand']],
  3: [[0, 0, 'battle', 0.45, 'stand'], [-0.85, -0.9, 'rifle', 0.2, 'crouch'], [0.85, -1.1, 'sniper', 0.75, 'stand']],
  4: [[-0.3, 0, 'rifle', 0.4, 'stand'], [0.55, -0.5, 'smg4', 0.7, 'stand'], [-1.05, -1.1, 'battle', 0.1, 'crouch'], [1.25, -1.5, 'marksman', 0.9, 'stand']] };
layouts[n].forEach(([x, z, w, yaw, stance], i) => {
  const ch = characters.create({ operator: i % 2 }); ch.setWeapon(w); ch.root.traverse(o => { if (o.isMesh) o.castShadow = true; }); s.add(ch.root, ch.weapon);
  for (let k = 0; k < 70; k++) ch.animator.update(1 / 60, { x, y: 0, z, yaw: Math.PI + yaw - 0.4, pitch: stance === 'crouch' ? 0.05 : -0.08, vx: 0, vz: 0, state: 'alive', stance, grounded: true, ads: i === 0 && n > 1, weapon: w });
});
const cam = new THREE.PerspectiveCamera(n === 1 ? 26 : 32, W / H, 0.1, 50); cam.position.set(0.3, 1.25, n === 1 ? 3.4 : 4.4); cam.lookAt(0, n === 1 ? 1.15 : 1.0, -0.4);
r.render(s, cam); window.ready = true;
</script></body></html>
