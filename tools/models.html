<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#8a9}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r = new THREE.WebGLRenderer(); r.setSize(1200, 500); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 5); s.add(d);
const cam = new THREE.PerspectiveCamera(30, 1200 / 500, 0.1, 100); const q = new URLSearchParams(location.search);
const L = new GLTFLoader(), files = ['operator_ksk', 'parachute', 'aircraft'];
const side = q.get('side');
for (let i = 0; i < 3; i++) { const g = await L.loadAsync(`/assets/models/${files[i]}.glb`); const o = g.scene; const b = new THREE.Box3().setFromObject(o), sz = b.getSize(new THREE.Vector3()); const k = 1 / Math.max(sz.x, sz.y, sz.z); o.scale.setScalar(k); const c = b.getCenter(new THREE.Vector3()).multiplyScalar(k); o.position.set((i - 1) * 1.3 - c.x, -c.y, -c.z); if (side) o.rotation.y = +side; s.add(o); console.log(files[i], sz.toArray().map(v => v.toFixed(2)).join(',')); }
cam.position.set(0, 0, 4.2); cam.lookAt(0, 0, 0); r.render(s, cam); window.ready = true;
</script></body></html>
